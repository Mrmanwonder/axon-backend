name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:generated-types
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:registry
      - run: npm run check:contract-parity

  dry-run:
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    strategy:
      matrix:
        worker: [triage, structure, crop, content, reconcile, adjudicate, explain, sweep, api, intelligence, document-vision]
      # One worker's dry-run failing should not hide the result for the rest.
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A dry run parse-checks and bundles the worker without deploying or
      # touching any live binding — it does not need account credentials.
      - run: npx wrangler deploy --dry-run
        working-directory: workers/${{ matrix.worker }}
      # AXO-126: the tutor-only profile is what production would run.
      - if: matrix.worker == 'intelligence'
        run: npx wrangler deploy --dry-run --env tutor
        working-directory: workers/intelligence

  # Deploys only run from main, and only once typecheck/tests/dry-run have
  # passed on this exact commit. See docs/DEPLOY.md for the manual
  # keep_bindings requirement this workflow relies on wrangler to handle —
  # `wrangler deploy` preserves existing secrets by default, but ALWAYS
  # verify bindings after the first deploy from this repo per
  # AXON_FIX_BRIEF.md §5.3.5.
  # AXO-126 · Tutor-only axon-intelligence. Off until the repository variable
  # TUTOR_DEPLOY_ENABLED is 'true', which the owner sets only after the Worker's
  # secrets exist (docs/TUTOR_DEPLOY_RUNBOOK.md). Migrations first: the D1
  # database exists but has never had its schema applied.
  deploy-intelligence-tutor:
    runs-on: ubuntu-latest
    needs: [typecheck-and-test, dry-run]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.TUTOR_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply axon-intelligence --remote --env tutor
        working-directory: workers/intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --env tutor --var AXON_DEPLOYMENT_SHA:${{ github.sha }}
        working-directory: workers/intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    runs-on: ubuntu-latest
    needs: [typecheck-and-test, dry-run, deploy-intelligence-tutor]
    # Runs whether the tutor job ran or was switched off, but never after it failed.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.typecheck-and-test.result == 'success' && needs.dry-run.result == 'success'
      && (needs.deploy-intelligence-tutor.result == 'success' || needs.deploy-intelligence-tutor.result == 'skipped')
    strategy:
      matrix:
        # intelligence and document-vision are deliberately excluded until the
        # release preflight has real privacy, benchmark, rollback, probe, and
        # secret evidence. No deployed Worker may bind to either service before
        # they are admitted to this same deployment plan.
        worker: [triage, structure, crop, content, reconcile, adjudicate, explain, sweep, api]
      # One worker's deploy failing should not silently skip verifying the
      # rest — each is independent and every failure should be visible.
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # AXO-126: mastery-api binds the Tutor only when the tutor Worker was
      # deployed in this same workflow; binding to a missing service would fail
      # every api deploy.
      - if: matrix.worker == 'api' && vars.TUTOR_DEPLOY_ENABLED == 'true'
        run: printf '\n[[services]]\nbinding = "INTELLIGENCE"\nservice = "axon-intelligence"\n' >> wrangler.toml
        working-directory: workers/api
      - if: matrix.worker == 'api'
        run: npx wrangler deploy --var TUTOR_ROLLOUT:${{ vars.TUTOR_ROLLOUT || 'off' }}
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: matrix.worker != 'api'
        run: npx wrangler deploy
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
