name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:generated-types
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:registry
      - run: npm run check:contract-parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A prompt edit moves answers as much as a model change does: it needs a linked passing eval run
  # (AXO-41/44/125). Full history so the base branch's manifest is readable.
  prompt-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-prompt-gate.mjs --base origin/${{ github.base_ref }}

  dry-run:
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    strategy:
      matrix:
        worker: [triage, structure, crop, content, reconcile, adjudicate, explain, sweep, api, intelligence, document-vision]
      # One worker's dry-run failing should not hide the result for the rest.
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A dry run parse-checks and bundles the worker without deploying or
      # touching any live binding — it does not need account credentials.
      - run: npx wrangler deploy --dry-run
        working-directory: workers/${{ matrix.worker }}
        if: matrix.worker != 'intelligence'
      # axon-intelligence ships its Tutor-only profile (AXO-126). The full document profile is
      # dry-run too, so neither can rot.
      - run: npx wrangler deploy --dry-run -c wrangler.tutor.jsonc
        working-directory: workers/intelligence
        if: matrix.worker == 'intelligence'
      - run: npx wrangler deploy --dry-run
        working-directory: workers/intelligence
        if: matrix.worker == 'intelligence'

  # axon-intelligence goes first, Tutor-only (AXO-126): mastery-api and mastery-sweep bind to it, and a
  # service binding to a Worker that does not exist yet fails their deploy. document-vision stays
  # out of the plan; this profile has no binding to it.
  deploy-intelligence:
    runs-on: ubuntu-latest
    needs: [typecheck-and-test, dry-run]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy -c wrangler.tutor.jsonc --var AXON_DEPLOYMENT_SHA:${{ github.sha }}
        working-directory: workers/intelligence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploys only run from main, and only once typecheck/tests/dry-run have
  # passed on this exact commit. See docs/DEPLOY.md for the manual
  # keep_bindings requirement this workflow relies on wrangler to handle —
  # `wrangler deploy` preserves existing secrets by default, but ALWAYS
  # verify bindings after the first deploy from this repo per
  # AXON_FIX_BRIEF.md §5.3.5.
  deploy:
    runs-on: ubuntu-latest
    needs: [typecheck-and-test, dry-run, deploy-intelligence]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        # document-vision is deliberately excluded until the release preflight has real
        # privacy, benchmark, rollback, probe, and secret evidence. axon-intelligence is
        # admitted for its Tutor-only internal stage (see deploy-intelligence above).
        worker: [triage, structure, crop, content, reconcile, adjudicate, explain, sweep, api]
      # One worker's deploy failing should not silently skip verifying the
      # rest — each is independent and every failure should be visible.
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
