name: Official scheme source smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 1"
  pull_request:
    paths:
      - "scripts/cbse-scheme-registry.mjs"
      - "scripts/lib/cbse-scheme.mjs"
      - "scripts/lib/cbse-scheme.test.mjs"
      - ".github/workflows/scheme-source-smoke.yml"

permissions:
  contents: read

jobs:
  cbse-physics:
    name: Verify current CBSE Physics SQP/MS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Verify official source pair without database writes
        run: npm run schemes:cbse -- verify --class=12 --subject=Physics
