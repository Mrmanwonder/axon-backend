name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'cloudbuild.yaml'
      - 'Dockerfile'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and push
        run: |
          docker build -t asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/cloud-run-source-deploy/axon-backend:${{ github.sha }} .
          docker push asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/cloud-run-source-deploy/axon-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy axon-backend \
            --image=asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/cloud-run-source-deploy/axon-backend:${{ github.sha }} \
            --region=asia-south1 \
            --platform=managed \
            --allow-unauthenticated \
            --timeout=300
