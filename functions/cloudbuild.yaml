steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'functions'
    args:
      - build
      - -t
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/axon-backend:$SHORT_SHA'
      - -t
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/axon-backend:latest'
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/axon-backend'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - axon-backend
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/axon-backend:$SHORT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --timeout=300
images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/axon-backend'
options:
  machineType: 'E2_HIGHCPU_8'
