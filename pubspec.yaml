name: axon
description: Axon - Edge AI Study Intelligence Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local LLM (Gemma GGUF)
  llamadart: ^0.6.10

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.4.1
  google_sign_in: ^6.2.2

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.4
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.2

  flutter_animate: ^4.5.2
  animations: ^2.0.11
  lottie: ^3.3.1
  auto_size_text: ^3.0.0

  google_fonts: any
  flutter_math_fork: ^0.7.2
  table_calendar: ^3.1.2
  flutter_svg: ^2.0.16

  path_drawing: ^1.0.1
  syncfusion_flutter_pdfviewer: ^33.1.46
  syncfusion_flutter_calendar: ^33.1.46

  file_picker: ^8.1.7
  image: ^4.5.3
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_image_labeling: ^0.14.2

  # Deep links (not used currently)
  # app_links: ^6.3.0

  url_launcher: ^6.3.1
  http: ^1.2.2
  dio: ^5.4.0
  http_parser: ^4.0.2
  html: ^0.15.5
  sqflite: ^2.4.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  google_generative_ai: ^0.4.0
  intl: any
  uuid: ^4.5.1
  flutter_blue_plus: ^1.35.2
  permission_handler: ^11.3.1
  workmanager: ^0.6.0
  home_widget: ^0.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.0.0
  web_socket_channel: ^3.0.1
  flutter_sound: ^9.2.13

  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  app_usage: ^4.0.1

  video_player: ^2.9.2
  chewie: ^1.8.5
  audioplayers: ^6.1.0
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  asn1lib: ^1.5.3
  wakelock_plus: ^1.2.10
  connectivity_plus: ^6.1.0
  sensors_plus: ^6.1.1
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  protobuf: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/Icon.png
  adaptive_icon_foreground: assets/icons/Icon.png
  adaptive_icon_background: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/images/Spark Lottie Animation.lottie
    - assets/icons/lottie.json
    - data/curriculum_catalog.json
    - data/caie_as_alvl_curriculum.json
    - assets/axon_content.db
    - assets/audio/
    - assets/subjects/
    - assets/shaders/gradient.png
    - assets/icons/
    - assets/glossary.json
    - assets/data/study_notes.json
    - assets/data/PYQs_rows.csv
    - assets/data/Datesheet_rows.csv
    - .env
  shaders:
    - assets/shaders/plasma.frag
    - shaders/particle_morph.frag
