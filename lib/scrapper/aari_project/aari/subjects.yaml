# AARI — Subject Configuration
# Used by: python -m aari.main --config subjects.yaml
#
# Format per entry:
#   code          : Board subject code (CAIE: 0xxx/9xxx, IB: dept code, Edexcel: see catalogue)
#   name          : Human-readable subject name
#   qualification : IGCSE | O-Level | A-Level | AS-Level | IB-DP
#   board         : CAIE | IBO | Edexcel
#
# The crawler respects robots.txt for every source. Only years listed
# under `target_years` are fetched. Remove years that are not yet published.

target_years:
  - 2022
  - 2023
  - 2024
  - 2025
  - 2026        # 2026 datesheets / specimen papers only

