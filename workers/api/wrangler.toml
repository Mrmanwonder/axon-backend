name = "mastery-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "axon-originals"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "axon-derived"

[[queues.producers]]
binding = "TRIAGE_QUEUE"
queue = "triage-queue"

[[queues.producers]]
binding = "EXPLAIN_QUEUE"
queue = "explain-queue"

# Private Tutor service (AXO-126). The target must be deployed first; the deploy workflow
# deploys axon-intelligence before this worker.
[[services]]
binding = "INTELLIGENCE"
service = "axon-intelligence"

# Secrets: ASSET_SIGNING_SECRET, MASTERY_ASSET_URL, R2_ACCESS_KEY_ID,
# R2_BUCKET_DERIVED, R2_BUCKET_ORIGINALS, R2_ENDPOINT, R2_SECRET_ACCESS_KEY,
# SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL,
# AXON_INTERNAL_TOKEN

# AXO-188: batch uploads (windows, 3 parallel PUTs) and originals after submit.
# Turned on for everyone at the owner's request on 5 Oct 2026, after the legacy
# path took about 2 minutes for a 12-page paper (AXO-196). Either value 0 rolls back.
[vars]
UPLOAD_BATCH_PERCENT = "100"
UPLOAD_ORIGINALS_PERCENT = "100"
