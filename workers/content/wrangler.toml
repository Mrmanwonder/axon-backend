name = "mastery-content"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "axon-originals"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "axon-derived"

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "reconcile-queue"

[[queues.producers]]
binding = "SELF_QUEUE"
queue = "content-queue"

# AXO-211: one invocation takes a batch and handles it concurrently, each
# message acked or retried on its own (shared/src/worker.ts consumeQueue).
# max_batch_size must equal QUEUE_TUNING.content.maxBatchSize in
# shared/src/queue_tuning.ts, which also holds the in-invocation concurrency
# and the wall/CPU/memory budget it is checked against; a test fails if the two drift.
# 24 regions per invocation, 12 model calls in flight each; up to 6 invocations
# keeps the stage's ceiling at 72 concurrent Gemini calls.
[[queues.consumers]]
queue = "content-queue"
max_batch_size = 24
max_batch_timeout = 1
max_retries = 3
max_concurrency = 6
dead_letter_queue = "content-dlq"

# Secrets: ASSET_SIGNING_SECRET, GOOGLE_API_KEY, GROQ_API_KEY (legacy, unused),
# MASTERY_ASSET_URL, OPENCODE_API_KEY (legacy, unused), OPENROUTER_API_KEY
# (legacy, unused — see AXON_FIX_BRIEF.md §F3), SUPABASE_SERVICE_ROLE_KEY,
# SUPABASE_URL, TAVILY_API_KEY
