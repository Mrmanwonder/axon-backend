name = "mastery-structure"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "axon-originals"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "axon-derived"

# Structure hands off to cropping when the crop stage is switched on
# (AXON_FIX_BRIEF.md §8), and straight to content when it is not — the flag
# lives in the database (`private.feature_flag`, key `crop_stage`) and can be
# flipped without a redeploy. So this worker binds BOTH producers and lets
# `advance_after_structure` decide which one it uses.
#
# The content binding was briefly removed when the crop stage was added, on the
# assumption that mastery-crop would always be the thing enqueuing content.
# That assumption is what made the flag-off path impossible and the deploy
# ordering load-bearing. Both bindings, always.
[[queues.producers]]
binding = "CROP_QUEUE"
queue = "crop-queue"

[[queues.producers]]
binding = "CONTENT_QUEUE"
queue = "content-queue"

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "reconcile-queue"

[[queues.producers]]
binding = "SELF_QUEUE"
queue = "structure-queue"

# AXO-211: one invocation takes a batch and handles it concurrently, each
# message acked or retried on its own (shared/src/worker.ts consumeQueue).
# max_batch_size must equal QUEUE_TUNING.structure.maxBatchSize in
# shared/src/queue_tuning.ts, which also holds the in-invocation concurrency
# and the wall/CPU/memory budget it is checked against; a test fails if the two drift.
#
# max_concurrency was 1 as containment: the handler allocated the run-wide
# order_index client-side (read the maximum, insert consecutive indexes), and
# continuations stitched onto "the last region written". Continuations are
# page-local with one run-level assembly pass since AXO-116. The index (and the
# numbered-label index) is now claimed safely under concurrency: the insert runs
# in pipeline_write under the paper lock, a page that loses the race gets 23505
# with its transaction rolled back, and it re-plans from the same model answer
# (workers/structure/src/index.ts, STRUCTURE_WRITE_ATTEMPTS). So pages of one
# paper now run together: a 13-page paper is one batch of 13 handled at once.
# At most 3 invocations at once, 13 calls each: 39 structure calls in flight.
[[queues.consumers]]
queue = "structure-queue"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 3
max_concurrency = 3
dead_letter_queue = "structure-dlq"

# Secrets: ASSET_SIGNING_SECRET, GOOGLE_API_KEY, GROQ_API_KEY (legacy, unused),
# MASTERY_ASSET_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL, TAVILY_API_KEY
