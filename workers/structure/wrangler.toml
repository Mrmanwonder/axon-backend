name = "mastery-structure"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "axon-originals"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "axon-derived"

# Structure hands off to cropping when the crop stage is switched on
# (AXON_FIX_BRIEF.md §8), and straight to content when it is not — the flag
# lives in the database (`private.feature_flag`, key `crop_stage`) and can be
# flipped without a redeploy. So this worker binds BOTH producers and lets
# `advance_after_structure` decide which one it uses.
#
# The content binding was briefly removed when the crop stage was added, on the
# assumption that mastery-crop would always be the thing enqueuing content.
# That assumption is what made the flag-off path impossible and the deploy
# ordering load-bearing. Both bindings, always.
[[queues.producers]]
binding = "CROP_QUEUE"
queue = "crop-queue"

[[queues.producers]]
binding = "CONTENT_QUEUE"
queue = "content-queue"

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "reconcile-queue"

[[queues.producers]]
binding = "SELF_QUEUE"
queue = "structure-queue"

[[queues.consumers]]
queue = "structure-queue"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
# Containment, not the intended architecture. The handler allocates global
# order_index client-side: it reads the current maximum, then inserts a run of
# consecutive indexes. Two page workers running at once read the same maximum
# and allocate the same indexes, and there is a unique constraint on
# (run_id, order_index) waiting for them. Cross-page continuation has the same
# shape — it stitches onto "the last existing region", which is only the right
# one if the previous page happens to have finished first.
#
# Concurrency 1 makes page order the arrival order rather than a race. It costs
# throughput on long booklets and it is deliberately temporary: the real fix is
# page-local detection plus one deterministic run-level assembly pass, which
# removes the shared counter entirely. Raise this only with that in place.
max_concurrency = 1
dead_letter_queue = "structure-dlq"

# Secrets: ASSET_SIGNING_SECRET, GOOGLE_API_KEY, GROQ_API_KEY (legacy, unused),
# MASTERY_ASSET_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL
