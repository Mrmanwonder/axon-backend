name = "mastery-explain"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "SELF_QUEUE"
queue = "explain-queue"

[[queues.consumers]]
queue = "explain-queue"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 10
dead_letter_queue = "explain-dlq"

# Secrets: ASSET_SIGNING_SECRET, GOOGLE_API_KEY, GROQ_API_KEY (legacy, unused),
# MASTERY_ASSET_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL
