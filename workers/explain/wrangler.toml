name = "mastery-explain"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The scheme check (AXO-202) reads the first page image to confirm the printed
# paper code before it fetches the scheme, so this worker needs the derived
# bucket (AXO-213). Read only: nothing here writes to R2.
[[r2_buckets]]
binding = "DERIVED"
bucket_name = "axon-derived"

[[queues.producers]]
binding = "SELF_QUEUE"
queue = "explain-queue"

# AXO-211: one invocation takes a batch and handles it concurrently, each
# message acked or retried on its own (shared/src/worker.ts consumeQueue).
# max_batch_size must equal QUEUE_TUNING.explain.maxBatchSize in
# shared/src/queue_tuning.ts, which also holds the in-invocation concurrency
# and the wall/CPU/memory budget it is checked against; a test fails if the two drift.
[[queues.consumers]]
queue = "explain-queue"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
max_concurrency = 10
dead_letter_queue = "explain-dlq"

# Secrets: ASSET_SIGNING_SECRET, GOOGLE_API_KEY, GROQ_API_KEY (legacy, unused),
# MASTERY_ASSET_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL, TAVILY_API_KEY, FIRECRAWL_API_KEY
