name = "mastery-reconcile"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "ADJUDICATE_QUEUE"
queue = "adjudicate-queue"

# NOTE: unlike every other consumer in this pipeline, mastery-reconcile has
# no SELF_QUEUE binding. That is not an oversight in this file — it is a
# faithful reconstruction of the live worker, tracked as a real gap in
# AXON_FIX_BRIEF.md §4.D2: a retryable failure here falls through to the
# queue's native message.retry() instead of shared/worker.ts's manual
# re-enqueue path. §9.2 is "add a SELF_QUEUE producer here"; not done in
# this port, which reconstructs current live behaviour rather than fixing it.

[[queues.consumers]]
queue = "reconcile-queue"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 10
dead_letter_queue = "reconcile-dlq"

# Secrets: ASSET_SIGNING_SECRET, MASTERY_ASSET_URL, SUPABASE_SERVICE_ROLE_KEY,
# SUPABASE_URL
