name = "mastery-reconcile"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
binding = "ADJUDICATE_QUEUE"
queue = "adjudicate-queue"

# Added per AXON_FIX_BRIEF.md §9.2 — every other consumer in this pipeline
# already has this. Without it, a retryable failure here fell through to the
# queue's native message.retry() instead of shared/worker.ts's manual
# re-enqueue path (§4.D2). Not a functional bug on its own (the native
# fallback works), just an inconsistency the shared retry path assumes away.
[[queues.producers]]
binding = "SELF_QUEUE"
queue = "reconcile-queue"

# AXO-211: one invocation takes a batch and handles it concurrently, each
# message acked or retried on its own (shared/src/worker.ts consumeQueue).
# max_batch_size must equal QUEUE_TUNING.reconcile.maxBatchSize in
# shared/src/queue_tuning.ts, which also holds the in-invocation concurrency
# and the wall/CPU/memory budget it is checked against; a test fails if the two drift.
[[queues.consumers]]
queue = "reconcile-queue"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
max_concurrency = 10
dead_letter_queue = "reconcile-dlq"

# Secrets: ASSET_SIGNING_SECRET, MASTERY_ASSET_URL, SUPABASE_SERVICE_ROLE_KEY,
# SUPABASE_URL
