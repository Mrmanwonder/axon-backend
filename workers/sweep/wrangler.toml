name = "mastery-sweep"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# "* * * * *" only dispatches private.stage_outbox (AXO-225); the 15-minute tick does everything else.
# "30 12 * * 0" (Sunday 12:30 UTC, 18:00 IST) sends the weekly parent digests (AXO-263) and nothing else.
crons = ["*/15 * * * *", "* * * * *", "30 12 * * 0"]

# AXO-263 weekly parent digest. Not secret, so kept here: a Worker setting that exists only in the
# dashboard is wiped by the next `wrangler deploy` (the dashboard warns about exactly this).
[vars]
DIGEST_APP_URL = "https://axonstudy.online"
DIGEST_FROM_ADDRESS = "updates@axonstudy.online"

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "axon-originals"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "axon-derived"

# Topic-tag work for the syllabus heatmap goes to the explain worker, which holds the model key.
[[queues.producers]]
binding = "EXPLAIN_QUEUE"
queue = "explain-queue"

# AXO-225: re-driven pages and regions from private.stage_outbox.
[[queues.producers]]
binding = "STRUCTURE_QUEUE"
queue = "structure-queue"

[[queues.producers]]
binding = "CONTENT_QUEUE"
queue = "content-queue"

# Carries Tutor deletion purges to axon-intelligence (AXO-126); needs AXON_ADMIN_TOKEN.
[[services]]
binding = "INTELLIGENCE"
service = "axon-intelligence"

# Secrets: ASSET_SIGNING_SECRET, MASTERY_ASSET_URL, R2_ACCESS_KEY_ID,
# R2_BUCKET_DERIVED, R2_BUCKET_ORIGINALS, R2_ENDPOINT, R2_SECRET_ACCESS_KEY,
# SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL
# AXON_ADMIN_TOKEN (Tutor purge)
# AXO-263 weekly parent digest: RESEND_API_KEY (secret, set in the dashboard); DIGEST_FROM_ADDRESS and DIGEST_APP_URL are in [vars] above.
# Until all three are set the Sunday run sends nothing and logs that it is not configured.
# Optional: ALERT_WEBHOOK_URL (spend alerts, AXO-124). Unset, alerts wait in cost_alert.
