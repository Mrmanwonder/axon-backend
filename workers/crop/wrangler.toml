name = "mastery-crop"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "axon-originals"

[[r2_buckets]]
binding = "DERIVED"
bucket_name = "axon-derived"

[[queues.producers]]
binding = "CONTENT_QUEUE"
queue = "content-queue"

[[queues.producers]]
binding = "RECONCILE_QUEUE"
queue = "reconcile-queue"

[[queues.producers]]
binding = "SELF_QUEUE"
queue = "crop-queue"

# One page per message, and that is not a knob to turn. A single invocation
# decodes a 2400x3200 page (about 30MB of RGBA before the codec's own heap) and
# then writes up to CROP_BUDGET crops and crop masks. Two pages in one message
# would double the peak memory and the subrequest count at the same time, and
# the subrequest ceiling is what took the content stage down once already.
[[queues.consumers]]
queue = "crop-queue"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 10
dead_letter_queue = "crop-dlq"

# Secrets: SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL
